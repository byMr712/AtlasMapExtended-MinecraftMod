plugins {
    id 'fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}
// Compile mixin annotations against Mixin 0.17.3. Starting with 0.17.4 `@Redirect.at`
// is an array in the bytecode, which NeoForge's bundled MixinExtras 0.5.3 cannot read
// (fixed only in MixinExtras 0.5.5).
configurations.all {
    resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
}


loom {
    splitEnvironmentSourceSets()

    mods {
        "atlasmapextended" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Fabric API's client gametest module is available from 1.21.5 onward.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "atlasmapextended-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!project.minecraft_version.startsWith('26')) {
        mappings loom.officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API is only used by the optional Fabric client gametests. It is not a
    // runtime dependency of the released mod; the mod code itself uses only vanilla APIs.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = project.minecraft_version.startsWith('26') ? 25 : 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

// ---------------------------------------------------------------------------
// NeoForge dual-target build: one source tree, two loaders.
// The Fabric entrypoint is excluded from the NeoForge JAR and the NeoForge
// stubs are excluded as well, so the same compiled classes run on both loaders.
// ---------------------------------------------------------------------------
sourceSets {
    neoforge {
        java {
            srcDirs = ['src/neoforge/java']
        }
        resources {
            srcDirs = ['src/neoforge/resources']
        }
        compileClasspath += sourceSets.main.output + sourceSets.client.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + configurations.runtimeClasspath
    }
}

processNeoforgeResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

def artifactVersion = "v${project.version}"

jar {
    archiveFileName = "${project.archives_base_name}-${artifactVersion}.jar"
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.matching { it.name == 'remapJar' }.configureEach {
    archiveFileName = "${project.archives_base_name}-${artifactVersion}.jar"
}

tasks.matching { it.name == 'sourcesJar' || it.name == 'remapSourcesJar' || it.name == 'javadocJar' }.configureEach {
    enabled = false
}

task jarNeoForge(type: Jar) {
    dependsOn compileNeoforgeJava, processNeoforgeResources, clientClasses, classes
    archiveFileName = "${project.archives_base_name.replace('-Fabric-', '-NeoForge-')}-${artifactVersion}.jar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        exclude "fabric.mod.json"
    }
    from(sourceSets.client.output) {
        // Fabric-only entrypoint; NeoForge uses AtlasMapExtendedNeoForge instead.
        exclude "org/webtrade/atlasmapextended/client/AtlasMapExtendedClient.class"
    }
    from(sourceSets.neoforge.output) {
        // Compile-time stubs must never reach the runtime classpath.
        exclude "net/**"
    }
    from("src/client/resources/assets/atlasmapextended/icon.png") {
        into ""
        rename { "icon.png" }
    }
    from("LICENSE")
}

build.dependsOn(jarNeoForge)
